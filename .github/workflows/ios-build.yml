name: iOS Build (Simulator & Device Release Unsigned)

on:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    name: Build iOS Simulator Debug (Unsigned)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer || true

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_BASE44_APP_ID: "6a654dcc789406839dc9b542"
          VITE_BASE44_APP_BASE_URL: "https://6a654dcc789406839dc9b542.base44.app"

      - name: Sync Capacitor iOS (Protected)
        run: npm run ios:sync

      - name: Build iOS App for Simulator (Unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

  build-ios-release:
    name: Build iOS Real Device Release (Unsigned)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer || true

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_BASE44_APP_ID: "6a654dcc789406839dc9b542"
          VITE_BASE44_APP_BASE_URL: "https://6a654dcc789406839dc9b542.base44.app"

      - name: Sync Capacitor iOS (Protected)
        run: npm run ios:sync

      - name: Build iOS App for Device Release (Unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
