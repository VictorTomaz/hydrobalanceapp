name: iOS Signed Release

on:
  workflow_dispatch:

jobs:
  build-and-sign-ios:
    name: Build and Sign iOS Release
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer || true

      - name: Validate Xcode and SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_VERSION=$(xcodebuild -version | grep Xcode | awk '{print $2}' | cut -d'.' -f1)
          IOS_SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version | cut -d'.' -f1)
          if [ "$XCODE_VERSION" -lt 26 ] || [ "$IOS_SDK_VERSION" -lt 26 ]; then
            echo "Xcode major < 26 or iphoneos SDK major < 26. Failing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_BASE44_APP_ID: "6a654dcc789406839dc9b542"
          VITE_BASE44_APP_BASE_URL: "https://6a654dcc789406839dc9b542.base44.app"

      - name: Sync Capacitor iOS (Protected)
        run: npm run ios:sync

      - name: Setup Temporary Keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "temp-password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp-password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          echo $APPLE_CERTIFICATE_BASE64 | base64 --decode -o certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp-password" build.keychain

      - name: Install Provisioning Profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo $APPLE_PROVISIONING_PROFILE_BASE64 | base64 --decode -o profile.mobileprovision
          
          security cms -D -i profile.mobileprovision > profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist)
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist)
          
          if [ "$TEAM_ID" != "BKXSXM4KM4" ]; then
            echo "TeamIdentifier is not BKXSXM4KM4"
            exit 1
          fi
          
          if [[ "$APP_ID" != *".com.base6a654dcc789406839dc9b542.app" ]]; then
            echo "application-identifier does not end with .com.base6a654dcc789406839dc9b542.app"
            exit 1
          fi
          
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/$UUID.mobileprovision
          
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> $GITHUB_ENV

      - name: Validate Apple Identity
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Apple Distribution: Matt Boyd" || true)
          if [ -z "$IDENTITY" ]; then
            echo "Apple Distribution: Matt Boyd not found in keychain."
            exit 1
          fi

      - name: Archive Assinado
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/HydroBalance.xcarchive \
            DEVELOPMENT_TEAM=${APPLE_TEAM_ID} \
            CURRENT_PROJECT_VERSION=${CURRENT_PROJECT_VERSION} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_NAME}" \
            PRODUCT_BUNDLE_IDENTIFIER=com.base6a654dcc789406839dc9b542.app

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>BKXSXM4KM4</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.base6a654dcc789406839dc9b542.app</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/HydroBalance.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export
            
          IPA_PATH=$(find build/export -name "*.ipa" | head -1)
          test -n "$IPA_PATH"
          test -s "$IPA_PATH"
          
          echo "caminho: $IPA_PATH"
          echo "nome: $(basename "$IPA_PATH")"
          echo "tamanho: $(ls -lh "$IPA_PATH" | awk '{print $5}')"

      - name: Validate Assinatura
        run: |
          IPA_PATH=$(find build/export -name "*.ipa" | head -1)
          mkdir -p temp_unzip
          unzip -q "$IPA_PATH" -d temp_unzip
          APP_PATH=$(find temp_unzip/Payload -name "*.app" | head -1)
          
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E "Format|Identifier|Authority|TeamIdentifier"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydrobalance-signed-release
          path: build/export/*.ipa

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f certificate.p12 profile.mobileprovision ExportOptions.plist profile.plist
          rm -rf temp_unzip build/export build/HydroBalance.xcarchive
